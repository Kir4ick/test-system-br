version: '3.9'

services:
    application:
        container_name: application
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        volumes:
            - ./:/var/www/app
        networks:
            - application
        depends_on:
            - database

    database:
        container_name: database
        image: mysql:latest
        ports:
            - "3306:${DB_PORT}"
        environment:
            MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
            MYSQL_DATABASE: ${DB_DATABASE}
            MYSQL_USER: ${DB_USERNAME}
            MYSQL_PASSWORD: ${DB_PASSWORD}
        networks:
            - application

    adminer:
        container_name: adminer
        image: adminer
        restart: always
        environment:
            ADMINER_DEFAULT_SERVER: database
        ports:
            - 8080:8080
        depends_on:
            -   database
        networks:
            - application

    server:
        container_name: server
        image: nginx:latest
        networks:
            - application
        ports:
            - "80:80"
        volumes:
            - ./:/var/www/app
            - ./docker/nginx/dev.conf:/etc/nginx/conf.d/default.conf

networks:
    application:
        driver: bridge
